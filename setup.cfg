[metadata]
name = sphinx-odoo-autodoc
author = Codeforward B.V.
author_email = info@codeforward.nl
license = GPLv3
license_files = LICENSE.txt
description = Sphinx extension to use autodoc on odoo.addons.*
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/codeforward-bv/sphinx-odoo-autodoc
project_urls =
    Website = https://www.codeforward.nl/
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: OS Independent
    Framework :: Sphinx :: Extension
    Topic :: Documentation :: Sphinx
    Intended Audience :: Developers

[options]
packages = find:
python_requires = >=3.8
install_requires = Sphinx >= 4.0
